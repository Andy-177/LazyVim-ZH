name: 功能建议
description: 提出新功能建议
title: "feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **重要：** 与 extras 相关的想法或需求，请发布到[Extras 需求](https://github.com/LazyVim/LazyVim/discussions/categories/extra-requests)
        讨论区。
  - type: checkboxes
    attributes:
      label: 你是否已查看文档？
      description: 提交功能建议前请确认你已阅读全部文档
      options:
        - label: 我已阅读全部 LazyVim 文档
          required: true
        - label: 这不是请求新增或已有的 extra（见上）
          required: true
  - type: textarea
    validations:
      required: true
    attributes:
      label: 你的功能建议是否与某个问题相关？请描述一下。
      description: 清晰、简洁地描述这个问题是什么。例如：我总是被 [...] 困扰。
  - type: textarea
    validations:
      required: true
    attributes:
      label: 描述你期望的解决方案
      description: 清晰、简洁地描述你希望发生什么。
  - type: textarea
    validations:
      required: true
    attributes:
      label: 描述你考虑过的其他方案
      description: 清晰、简洁地描述你考虑过的其他解决方案或功能。
  - type: textarea
    validations:
      required: false
    attributes:
      label: 补充说明
      description: 在这里补充与该功能建议有关的其他信息或截图。
